`#include <stdio.h>

void binary(int n)
{
    int bits[32], i = 0;

    if (n == 0) {
        printf("0");
        return;
    }

    if (n < 0) {
        printf("Please enter a non-negative number.");
        return;
    }

    while (n > 0) {
        bits[i++] = n % 2;
        n /= 2;
    }

    for (int j = i - 1; j >= 0; j--)
        printf("%d", bits[j]);
}

int main(void)
{
    int num;
    printf("Enter the number: ");
    scanf("%d", &num);

    printf("Binary of %d is: ", num);
    binary(num);
    printf("\\n");

    return 0;
}`,

`#include <stdio.h>

int prime(int n)
{
    if (n < 2)
        return 0;

    for (int i = 2; i * i <= n; i++) {
        if (n % i == 0)
            return 0;
    }

    return 1;
}

int main(void)
{
    int num, flag = 0;

    printf("Enter a number: ");
    scanf("%d", &num);

    printf("Prime numbers that divide %d are: ", num);

    for (int i = 2; i <= num / 2; i++) {
        if (prime(i) && num % i == 0) {
            printf("%d ", i);
            flag = 1;
        }
    }

    if (!flag)
        printf("None");

    printf("\\n");
    return 0;
}`,

`#include <stdio.h>

int main(void)

    printf("Enter a number: ");
    scanf("%d", &num);

    if (num <= 1) {
        printf("%d is not a prime number.\\n", num);
        return 0;
    }

    for (int i = 2; i * i <= num; i++) {
        if (num % i == 0) {
            flag = 1;
            break;
        }
    }

    if (flag == 0)
        printf("%d is a prime number.\\n", num);
    else
        printf("%d is not a prime number.\\n", num);

    return 0;
}`,

`#include <stdio.h>

int main(void)
{
    int choice, a, b;
    char ch;

    while (1) {
        printf("\\nCHOICE:\\n");
        printf("1. Addition\\n2. Subtraction\\n");
        printf("3. Multiplication\\n4. Division\\n");
        printf("5. Modulo\\nQ. Quit\\n");
        printf("Enter your choice: ");
        scanf(" %c", &ch);

        if (ch == 'Q' || ch == 'q') {
            printf("Exiting program...\\n");
            break;
        }

        if (ch < '1' || ch > '5') {
            printf("Invalid choice\\n");
            continue;
        }

        choice = ch - '0';

        printf("Enter two integers: ");
        scanf("%d %d", &a, &b);

        switch (choice) {
            case 1:
                printf("Addition = %d\\n", a + b);
                break;
            case 2:
                printf("Subtraction = %d\\n", a - b);
                break;
            case 3:
                printf("Multiplication = %d\\n", a * b);
                break;
            case 4:
                if (b != 0)
                    printf("Division = %.2f\\n", (float)a / b);
                else
                    printf("Division by zero is not allowed.\\n");
                break;
            case 5:
                if (b != 0)
                    printf("Modulo = %d\\n", a % b);
                else
                    printf("Modulo by zero is not allowed.\\n");
                break;
        }
    }

    return 0;
}`,

`#include <stdio.h>

int main(void)
{
    int n, original, temp, digits = 0;
    long long sum = 0;

    printf("Enter a number: ");
    scanf("%d", &n);

    if (n < 0) {
        printf("Negative numbers are not considered here.\\n");
        return 0;
    }

    original = n;
    temp = n;

    do {
        digits++;
        temp /= 10;
    } while (temp != 0);

    temp = n;

    do {
        int digit = temp % 10;
        long long power = 1;

        for (int i = 0; i < digits; i++)
            power *= digit;

        sum += power;
        temp /= 10;
    } while (temp != 0);

    if (sum == original)
        printf("%d is an Armstrong number.\\n", original);
    else
        printf("%d is not an Armstrong number.\\n", original);

    return 0;
}`,

        const questionBox = document.getElementById("questionBox");

        questions.forEach((question, index) => {
            const card = document.createElement("div");
            card.className = "question";

            const link = document.createElement("a");
            link.href = "#result";
            link.textContent = (index + 1) + ". " + question;

            link.addEventListener("click", function (event) {
                event.preventDefault();
                showProgram(index);
            });

            card.appendChild(link);
            questionBox.appendChild(card);
        });

        function showProgram(index) {
            document.getElementById("result").style.display = "block";

            document.getElementById("title").textContent =
                (index + 1) + ". " + questions[index];

            document.getElementById("code").textContent = codes[index];
            document.getElementById("output").textContent = outputs[index];
