
<!DOCTYPE html>
<html>
<head>
    <title>C Language - Structure Programs</title>

    <style>
        body {
            background-color: lightyellow;
            font-family: Arial, sans-serif;
            margin: 20px;
            color: darkblue;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        h2 {
            color: darkgreen;
        }

        .question {
            background-color: white;
            border: 2px solid lightblue;
            border-radius: 10px;
            padding: 12px;
            margin: 10px 0;
        }

        .question a {
            color: darkblue;
            text-decoration: none;
            font-weight: bold;
        }

        .question a:hover {
            color: red;
        }

        #result {
            display: none;
            background-color: white;
            border: 2px solid lightblue;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
        }

        .result-box {
            display: flex;
            gap: 20px;
        }

        .program-box, .output-box {
            flex: 1;
            min-width: 0;
            background-color: #f8ffff;
            border: 2px solid lightblue;
            border-radius: 10px;
            padding: 12px;
        }

        pre {
            background-color: #eeeeee;
            color: black;
            padding: 12px;
            border-radius: 8px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            overflow-x: auto;
            font-size: 14px;
        }

        button {
            background-color: darkblue;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            font-size: 16px;
        }

        button:hover {
            background-color: darkgreen;
        }

        .home {
            text-align: center;
            margin: 30px 0 10px;
        }

        @media (max-width: 700px) {
            .result-box {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <h1>Structure in C Language</h1>

    <p style="text-align:center;">
        Click any question to view its program and output.
    </p>

    <h2>List of Questions</h2>

    <div id="questions"></div>

    <div id="result">
        <h2 id="questionTitle"></h2>

        <div class="result-box">
            <div class="program-box">
                <h3>C Program</h3>
                <pre id="code"></pre>
            </div>

            <div class="output-box">
                <h3>Sample Output</h3>
                <pre id="output"></pre>
            </div>
        </div>
    </div>

    <div class="home">
        <button onclick="location.href='home.html'">Home</button>
    </div>

    <script>
        const questions = [
            "1. Store employee ID, name and designation for up to 50 employees and display them in a table.",
            "2. Store employee details and print only employee names.",
            "3. Print each employee's name character by character with their employee ID.",
            "4. Enter student details and display them in ascending order of roll number."
        ];

        const codes = [

String.raw`#include <stdio.h>

struct employee {
    int id;
    char name[50];
    char designation[50];
};

int main(void) {
    struct employee emp[50];
    int i, n;

    printf("Enter number of employees (max 50): ");
    scanf("%d", &n);

    if (n < 1 || n > 50) {
        printf("Invalid number of employees!\n");
        return 0;
    }

    for (i = 0; i < n; i++) {
        printf("\nEmployee %d\n", i + 1);

        printf("Enter employee ID: ");
        scanf("%d", &emp[i].id);

        printf("Enter employee name: ");
        scanf(" %49[^\n]", emp[i].name);

        printf("Enter designation: ");
        scanf(" %49[^\n]", emp[i].designation);
    }

    printf("\nEmployee Details\n");
    printf("-----------------------------------------------\n");
    printf("%-10s %-20s %-20s\n",
           "ID", "Name", "Designation");
    printf("-----------------------------------------------\n");

    for (i = 0; i < n; i++) {
        printf("%-10d %-20s %-20s\n",
               emp[i].id,
               emp[i].name,
               emp[i].designation);
    }

    return 0;
}`,

String.raw`#include <stdio.h>

struct employee {
    int id;
    char name[50];
    char designation[50];
};

int main(void) {
    struct employee emp[50];
    int i, j, n;

    printf("Enter number of employees (max 50): ");
    scanf("%d", &n);

    if (n < 1 || n > 50) {
        printf("Invalid number of employees!\n");
        return 0;
    }

    for (i = 0; i < n; i++) {
        printf("\nEmployee %d\n", i + 1);

        printf("Enter employee ID: ");
        scanf("%d", &emp[i].id);

        printf("Enter employee name: ");
        scanf(" %49[^\n]", emp[i].name);

        printf("Enter designation: ");
        scanf(" %49[^\n]", emp[i].designation);
    }

    printf("\nEmployee ID and Name Characters\n");
    printf("--------------------------------\n");

    for (i = 0; i < n; i++) {
        printf("%d\t", emp[i].id);

        for (j = 0; emp[i].name[j] != '\0'; j++) {
            printf("%c ", emp[i].name[j]);
        }

        printf("\n");
    }

    return 0;
}`,

String.raw`#include <stdio.h>

struct student {
    int roll;
    char name[50];
    float fee;
    char dob[15];
};

int main(void) {
    struct student s[100], temp;
    int n, i, j;

    printf("Enter number of students (max 100): ");
    scanf("%d", &n);

    if (n < 1 || n > 100) {
        printf("Invalid number of students!\n");
        return 0;
    }

    for (i = 0; i < n; i++) {
        printf("\nStudent %d\n", i + 1);

        printf("Enter roll number: ");
        scanf("%d", &s[i].roll);

        printf("Enter name: ");
        scanf(" %49[^\n]", s[i].name);

        printf("Enter fee: ");
        scanf("%f", &s[i].fee);

        printf("Enter DOB (DD/MM/YYYY): ");
        scanf("%14s", s[i].dob);
    }

    for (i = 0; i < n - 1; i++) {
        for (j = i + 1; j < n; j++) {
            if (s[i].roll > s[j].roll) {
                temp = s[i];
                s[i] = s[j];
                s[j] = temp;
            }
        }
    }

    printf("\nStudent Details in Ascending Roll Order\n");
    printf("---------------------------------------------------------------\n");
    printf("%-10s %-20s %-12s %-15s\n",
           "Roll", "Name", "Fee", "DOB");
    printf("---------------------------------------------------------------\n");

    for (i = 0; i < n; i++) {
        printf("%-10d %-20s %-12.2f %-15s\n",
               s[i].roll, s[i].name, s[i].fee, s[i].dob);
    }

    return 0;
}`

        ];

        const questionList = document.getElementById("questions");

        questions.forEach(function(question, index) {
            const box = document.createElement("div");
            box.className = "question";

            const link = document.createElement("a");
            link.href = "#result";
            link.textContent = question;

            link.onclick = function() {
                showProgram(index);
            };

            box.appendChild(link);
            questionList.appendChild(box);
        });

        function showProgram(index) {
            document.getElementById("questionTitle").textContent =
                questions[index];

            document.getElementById("code").textContent = codes[index];
            document.getElementById("output").textContent = outputs[index];

            document.getElementById("result").style.display = "block";

            document.getElementById("result").scrollIntoView({
                behavior: "smooth",
                block: "start"
            });
        }
    </script>

</body>
</html>
