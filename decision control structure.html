
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>C Programming Questions - Decision Control</title>

    <style>
        body {
            background-color: lightyellow;
            font-family: Arial, sans-serif;
            margin: 20px;
            color: darkblue;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        h2 {
            color: darkgreen;
        }

        .question {
            background-color: white;
            border: 2px solid lightblue;
            border-radius: 10px;
            padding: 12px;
            margin: 10px 0;
        }

        a {
            color: darkblue;
            text-decoration: none;
        }

        a:hover {
            color: red;
        }

        #result {
            display: none;
            background-color: white;
            border: 2px solid lightblue;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
        }

        .result-box {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            margin-top: 15px;
        }

        .program-box,
        .output-box {
            flex: 1;
            min-width: 0;
            background-color: #f8ffff;
            border: 1px solid lightblue;
            border-radius: 8px;
            padding: 12px;
        }

        pre {
            background-color: #eeeeee;
            color: black;
            padding: 12px;
            border-radius: 5px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            min-height: 100px;
        }

        button {
            background-color: darkblue;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background-color: darkgreen;
        }

        @media (max-width: 600px) {
            .result-box {
                flex-direction: column;
            }

            .program-box,
            .output-box {
                width: auto;
                align-self: stretch;
            }
        }
    </style>
</head>

<body>

    <h1>C Programming Questions</h1>

    <p style="text-align:center;">
        Decision Control Programs
    </p>

    <h2>Click on a question to see its program and output</h2>

    <div id="questions"></div>

    <div id="result">
        <h2 id="title"></h2>

        <div class="result-box">

            <div class="program-box">
                <h3>Program:</h3>
                <pre id="code"></pre>
            </div>

            <div class="output-box">
                <h3>Expected Output:</h3>
                <pre id="output"></pre>
            </div>

        </div>
    </div>

    <div style="text-align:center;">
        <button onclick="window.location.href='home.html'">
            Home
        </button>
    </div>

    <script>
        var questions = [
            "Write a program to check whether a number is positive, negative or zero.",
            "Write a program to check whether a number is odd or even.",
            "Write a program to check whether a number has 1, 2, 3, 4 or 5 digits.",
            "Write a program to display the grade according to the entered marks.",
            "Write a program to check whether a number is decimal or integer.",
            "Write a program to convert a positive number into negative and a negative number into positive.",
            "Write a program to check whether a character is an alphabet.",
            "Write a program to square a negative number and increment a positive number 20 times.",
            "Write a program to check whether a number is positive, negative or zero.",
            "Write a program to find the greater of two numbers.",
            "Write a program to check whether a number is divisible by 4.",
            "Write a program to check whether four characters are equal or not.",
            "Write a program to find the greatest of three numbers.",
            "Write a program to display months according to the number of days.",
            "Write a program to print a one-digit number in words.",
            "Write a program to check whether two characters are the same and find their difference.",
            "Write a program to find the greatest of three numbers.",
            "Write a program to print a two-digit number in words.",
            "Write a program to identify an uppercase, lowercase, digit or special character.",
            "Write a program to check whether a year is a leap year or not."
        ];

        var codes = [

`#include <stdio.h>

int main()
{
    int n;

    printf("Enter the number: ");
    scanf("%d", &n);

    if(n > 0)
        printf("THE NUMBER IS POSITIVE");
    else if(n < 0)
        printf("THE NUMBER IS NEGATIVE NUMBER");
    else
        printf("ZERO");

    return 0;
}`,

`#include <stdio.h>

int main()
{
    int n;

    printf("Enter a number: ");
    scanf("%d", &n);

    if(n % 2 != 0)
        printf("The number is odd");
    else
        printf("The number is even");

    return 0;
}`,

`#include <stdio.h>

int main()
{
    int num;

    printf("Enter a number: ");
    scanf("%d", &num);

    if(num >= 0 && num <= 9)
        printf("It is a 1 digit number");
    else if(num >= 10 && num <= 99)
        printf("It is a 2 digit number");
    else if(num >= 100 && num <= 999)
        printf("It is a 3 digit number");
    else if(num >= 1000 && num <= 9999)
        printf("It is a 4 digit number");
    else if(num >= 10000 && num <= 99999)
        printf("It is a 5 digit number");
    else
        printf("It is more than 5 digits or a negative number");

    return 0;
}`,

`#include <stdio.h>

int main()
{
    int num;

    printf("Enter the marks: ");
    scanf("%d", &num);

    if(num < 0 || num > 100)
        printf("THE NUMBER IS INVALID");
    else if(num >= 80)
        printf("The grade is A");
    else if(num >= 60)
        printf("The grade is B");
    else if(num >= 40)
        printf("The grade is C");
    else
        printf("FAIL");

    return 0;
}`,

`#include <stdio.h>

int main()
{
    float num;

    printf("Enter the number: ");
    scanf("%f", &num);

    if(num == (int)num)
        printf("The number is not decimal (it is an integer)");
    else
        printf("The number is a decimal number");

    return 0;
}`,

`#include <stdio.h>

int main()
{
    int num;

    printf("Enter the number: ");
    scanf("%d", &num);

    num = -num;

    printf("The converted number is: %d", num);

    return 0;
}`,

`#include <stdio.h>

int main()
{
    char ch;

    printf("Enter a character: ");
    scanf(" %c", &ch);

    if((ch >= 'A' && ch <= 'Z') ||
       (ch >= 'a' && ch <= 'z'))
        printf("IT IS AN ALPHABET");
    else
        printf("NOT AN ALPHABET");

    return 0;
}`,

`#include <stdio.h>

int main()
{
    int num, square;

    printf("Enter the number: ");
    scanf("%d", &num);

    if(num < 0)
    {
        square = num * num;
        printf("Square = %d", square);
    }
    else if(num > 0)
    {
        num = num + 20;
        printf("Number after 20 increments = %d", num);
    }
    else
    {
        printf("Invalid");
    }

    return 0;
}`,

`#include <stdio.h>

int main()
{
    int num;

    printf("Enter the number: ");
    scanf("%d", &num);

    if(num > 0)
        printf("THE NUMBER IS POSITIVE");
    else if(num < 0)
        printf("THE NUMBER IS NEGATIVE NUMBER");
    else
        printf("The number is zero");

    return 0;
}`,

`#include <stdio.h>

int main()
{
    int num1, num2;

    printf("Enter the first number: ");
    scanf("%d", &num1);

    printf("Enter the second number: ");
    scanf("%d", &num2);

    if(num1 > num2)
        printf("The greater number is: %d", num1);
    else if(num2 > num1)
        printf("The greater number is: %d", num2);
    else
        printf("Both are equal");

    return 0;
}`,

`#include <stdio.h>

int main()
{
    int num;

    printf("Enter the number: ");
    scanf("%d", &num);

    if(num % 4 == 0)
        printf("The number %d is divisible by 4.", num);
    else
        printf("Not divisible by 4");

    return 0;
}`,

`#include <stdio.h>

int main()
{
    char ch1, ch2, ch3, ch4;

    printf("Enter the first character: ");
    scanf(" %c", &ch1);

    printf("Enter the second character: ");
    scanf(" %c", &ch2);

    printf("Enter the third character: ");
    scanf(" %c", &ch3);

    printf("Enter the fourth character: ");
    scanf(" %c", &ch4);

    if(ch1 == ch2 && ch2 == ch3 && ch3 == ch4)
        printf("All are equal");
    else
        printf("Not equal");

    return 0;
}`,

`#include <stdio.h>

int main()
{
    int num1, num2, num3;

    printf("Enter the first number: ");
    scanf("%d", &num1);

    printf("Enter the second number: ");
    scanf("%d", &num2);

    printf("Enter the third number: ");
    scanf("%d", &num3);

    if(num1 >= num2 && num1 >= num3)
        printf("Greatest number is: %d", num1);
    else if(num2 >= num1 && num2 >= num3)
        printf("Greatest number is: %d", num2);
    else
        printf("Greatest number is: %d", num3);

    return 0;
}`,

`#include <stdio.h>

int main()
{
    int days;

    printf("Enter number of days in a month: ");
    scanf("%d", &days);

    switch(days)
    {
        case 28:
        case 29:
            printf("February");
            break;

        case 30:
            printf("April, June, September, November");
            break;

        case 31:
            printf("January, March, May, July, August, October, December");
            break;

        default:
            printf("INVALID");
    }

    return 0;
}`,

`#include <stdio.h>

int main()
{
    int num;

    printf("Enter a one-digit number: ");
    scanf("%d", &num);

    switch(num)
    {
        case 0: printf("ZERO"); break;
        case 1: printf("ONE"); break;
        case 2: printf("TWO"); break;
        case 3: printf("THREE"); break;
        case 4: printf("FOUR"); break;
        case 5: printf("FIVE"); break;
        case 6: printf("SIX"); break;
        case 7: printf("SEVEN"); break;
        case 8: printf("EIGHT"); break;
        case 9: printf("NINE"); break;
        default: printf("Invalid input. Enter a one-digit number.");
    }

    return 0;
}`,

`#include <stdio.h>

int main()
{
    char ch1, ch2;
    int diff;

    printf("Enter first character: ");
    scanf(" %c", &ch1);

    printf("Enter second character: ");
    scanf(" %c", &ch2);

    if(ch1 == ch2)
    {
        printf("Both characters are the same");
    }
    else
    {
        diff = ch1 - ch2;
        printf("Characters are not the same\\n");
        printf("Difference between them = %d", diff);
    }

    return 0;
}`,

`#include <stdio.h>

int main()
{
    int num1, num2, num3;

    printf("Enter the first number: ");
    scanf("%d", &num1);

    printf("Enter the second number: ");
    scanf("%d", &num2);

    printf("Enter the third number: ");
    scanf("%d", &num3);

    if(num1 >= num2 && num1 >= num3)
        printf("Greatest number is: %d", num1);
    else if(num2 >= num1 && num2 >= num3)
        printf("Greatest number is: %d", num2);
    else
        printf("Greatest number is: %d", num3);

    return 0;
}`,

`#include <stdio.h>

int main()
{
    int num, first, second;

    printf("Enter a two-digit number: ");
    scanf("%d", &num);

    if(num < 10 || num > 99)
    {
        printf("Please enter a valid two-digit number");
        return 0;
    }

    first = num / 10;
    second = num % 10;

    switch(first)
    {
        case 0: printf("zero "); break;
        case 1: printf("one "); break;
        case 2: printf("two "); break;
        case 3: printf("three "); break;
        case 4: printf("four "); break;
        case 5: printf("five "); break;
        case 6: printf("six "); break;
        case 7: printf("seven "); break;
        case 8: printf("eight "); break;
        case 9: printf("nine "); break;
    }

    switch(second)
    {
        case 0: printf("zero"); break;
        case 1: printf("one"); break;
        case 2: printf("two"); break;
        case 3: printf("three"); break;
        case 4: printf("four"); break;
        case 5: printf("five"); break;
        case 6: printf("six"); break;
        case 7: printf("seven"); break;
        case 8: printf("eight"); break;
        case 9: printf("nine"); break;
    }

    return 0;
}`,

`#include <stdio.h>

int main()
{
    char ch;

    printf("Enter any character: ");
    scanf(" %c", &ch);

    if(ch >= 'A' && ch <= 'Z')
        printf("IT IS AN UPPERCASE CHARACTER");
    else if(ch >= 'a' && ch <= 'z')
        printf("IT IS A LOWERCASE CHARACTER");
    else if(ch >= '0' && ch <= '9')
        printf("IT IS A DIGIT");
    else
        printf("IT IS A SPECIAL CHARACTER");

    return 0;
}`,

`#include <stdio.h>

int main()
{
    int year;

    printf("Enter the year: ");
    scanf("%d", &year);

    if((year % 400 == 0) ||
       (year % 4 == 0 && year % 100 != 0))
    {
        printf("%d is a leap year", year);
    }
    else
    {
        printf("%d is not a leap year", year);
    }

    return 0;
}`
        ];

        var outputs = [
`Enter the number: -5

`Enter a number: 8

`Enter a number: 125

        ];

        var questionBox = document.getElementById("questions");

        questions.forEach(function(question, index) {
            var div = document.createElement("div");
            div.className = "question";

            var link = document.createElement("a");
            link.href = "#result";
            link.textContent = (index + 1) + ". " + question;

            link.onclick = function() {
                showProgram(index, link.textContent);
            };

            div.appendChild(link);
            questionBox.appendChild(div);
        });

        function showProgram(n, question) {
            document.getElementById("result").style.display = "block";
            document.getElementById("title").innerText = question;
            document.getElementById("code").innerText = codes[n];
            document.getElementById("output").innerText = outputs[n];

            document.getElementById("result").scrollIntoView({
                behavior: "smooth",
                block: "start"
            });
        }
    </script>

</body>
</html>
